name: Build & Push Image

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:              # 支持手动触发
  push:
    branches:
      - main
    tags:
      - "v*"


# 同一分支/标签的整次运行串行；不取消正在导出的 cache-to，
# 只让后到的运行排队等待，避免构建结束时缓存写不进去。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # 允许推送 GHCR 包

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and date
        id: image
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          DATE="$(date -u +%Y%m%d)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "DATE=${DATE}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # 缓存按 ref 隔离：branch/tag 名可能含 /、中文、空格等 OCI tag
          # 不允许的字符，也可能超长。先清洗成合法字符并截断，再拼 12 位
          # hash，保证不同 ref 不会因为截断撞到同一个 tag。
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//' | cut -c1-60)
          REF_HASH=$(printf '%s' "${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}" | sha256sum | cut -c1-12)
          CACHE_TAG="buildcache-latest-${GITHUB_REF_TYPE}-${SAFE_REF}-${REF_HASH}"
          echo "CACHE_TAG=${CACHE_TAG}" >> "$GITHUB_OUTPUT"
          echo "CACHE_REF=ghcr.io/${IMAGE_NAME}:${CACHE_TAG}" >> "$GITHUB_OUTPUT"

          # 单一发布变体：latest 是 BtbN 静态 ffmpeg；日期标签用于固定版本。
          TAGS="$(printf '%s\n' \
            "ghcr.io/${IMAGE_NAME}:latest" \
            "ghcr.io/${IMAGE_NAME}:${DATE}" \
            "ghcr.io/${IMAGE_NAME}:${DATE}-${SHORT_SHA}")"
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve cache source
        id: cache
        run: |
          # 首次构建没有 buildcache 时不要传 cache-from，避免把 missing manifest
          # 当成构建错误；有缓存时才启用 registry cache 导入。
          : > /tmp/cache-from
          REF="${{ steps.image.outputs.CACHE_REF }}"
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "type=registry,ref=${REF}" >> /tmp/cache-from
          fi
          {
            echo "from<<EOF"
            cat /tmp/cache-from
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable BtbN FFmpeg GPL build
        id: ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          if ! JSON=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API"); then
            echo "GitHub API 不可用，无法解析 BtbN latest release；拒绝发布旧版本" >&2
            exit 1
          fi

          VERSION=$(printf '%s' "$JSON" \
            | jq -r '.assets[].name' \
            | sed -nE 's/^ffmpeg-n([0-9]+\.[0-9]+)-latest-linux64-gpl-\1\.tar\.xz$/\1/p' \
            | sort -V \
            | tail -n1 || true)
          if [ -z "${VERSION:-}" ]; then
            echo "BtbN latest release 中没有 nX.Y 稳定 GPL 资产；拒绝发布旧版本" >&2
            exit 1
          fi

          for ARCH in linux64 linuxarm64; do
            ASSET="ffmpeg-n${VERSION}-latest-${ARCH}-gpl-${VERSION}.tar.xz"
            if ! printf '%s' "$JSON" \
              | jq -e --arg name "$ASSET" '.assets[]? | select(.name == $name)' >/dev/null; then
              echo "BtbN 缺少资产 ${ASSET}；拒绝发布不完整的多架构镜像" >&2
              exit 1
            fi
          done

          # Release asset 的 digest 是 GitHub 计算的 sha256；传给 Dockerfile
          # 在解压前校验，避免下载到损坏/被替换的二进制。
          AMD64_ASSET="ffmpeg-n${VERSION}-latest-linux64-gpl-${VERSION}.tar.xz"
          ARM64_ASSET="ffmpeg-n${VERSION}-latest-linuxarm64-gpl-${VERSION}.tar.xz"
          AMD64_DIGEST=$(printf '%s' "$JSON" \
            | jq -r --arg name "${AMD64_ASSET}" '.assets[]? | select(.name == $name) | .digest // ""')
          ARM64_DIGEST=$(printf '%s' "$JSON" \
            | jq -r --arg name "${ARM64_ASSET}" '.assets[]? | select(.name == $name) | .digest // ""')
          if [ -z "${AMD64_DIGEST}" ] || [ -z "${ARM64_DIGEST}" ]; then
            echo "BtbN 资产缺少 sha256 digest，无法校验下载内容" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256_amd64=${AMD64_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          echo "sha256_arm64=${ARM64_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          echo "Resolved BtbN FFmpeg GPL stable branch: n${VERSION}"
          echo "sha256 amd64=${AMD64_DIGEST#sha256:}"
          echo "sha256 arm64=${ARM64_DIGEST#sha256:}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: latest
          # 将镜像标签版本（DATE-SHORT_SHA）烤入镜像，供「关于」界面显示
          # FFMPEG_BUILDS_REFRESH 按 run 变化，强制每次重新下载 BtbN 资产。
          build-args: |
            APP_VERSION=${{ steps.image.outputs.DATE }}-${{ steps.image.outputs.SHORT_SHA }}
            FFMPEG_BUILDS_VERSION=${{ steps.ffmpeg.outputs.version }}
            FFMPEG_BUILDS_SHA256_AMD64=${{ steps.ffmpeg.outputs.sha256_amd64 }}
            FFMPEG_BUILDS_SHA256_ARM64=${{ steps.ffmpeg.outputs.sha256_arm64 }}
            FFMPEG_BUILDS_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # 缓存放在 GHCR 独立 tag，而不是 GitHub Actions 仓库缓存：
          # 双架构 mode=max 容易触及 GHA 缓存配额，导致旧层被淘汰、命中率下降。
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: type=registry,ref=${{ steps.image.outputs.CACHE_REF }},mode=max,ignore-error=true
          tags: ${{ steps.image.outputs.TAGS }}

      - name: Verify registry cache
        if: success()
        run: |
          # cache-to 的 ignore-error 不让构建失败；这里只做可观测性检查。
          # 镜像已经推送成功，缓存导出失败不应把发布 job 变红并跳过 smoke。
          if docker buildx imagetools inspect "${{ steps.image.outputs.CACHE_REF }}" >/dev/null; then
            echo "Registry cache verified: ${{ steps.image.outputs.CACHE_REF }}"
          else
            echo "::warning::registry cache 不可读，镜像已推送，仅影响后续构建加速"
          fi

      - name: 构建失败通知
        if: failure()
        env:
          # 可选：配置仓库 secret WEBHOOK_URL（飞书/企业微信/钉钉机器人地址）即可推送失败告警
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          echo "::error::yt-dlp-webui 镜像构建失败（run #${{ github.run_number }}）"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -fsS -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"yt-dlp-webui 镜像构建失败 run#${{ github.run_number }}\"}}" || true
          fi

  smoke:
    name: Smoke test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          for PLATFORM in linux/amd64 linux/arm64; do
            docker pull --platform "$PLATFORM" "ghcr.io/${IMAGE_NAME}:latest"
          done

      - name: Verify ffmpeg and ffprobe
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          for PLATFORM in linux/amd64 linux/arm64; do
            echo "== ${PLATFORM} =="
            docker run --rm --platform "$PLATFORM" --entrypoint ffmpeg "$IMAGE" -version
            docker run --rm --platform "$PLATFORM" --entrypoint ffprobe "$IMAGE" -version
          done

      - name: Verify MP3 encoder
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          for PLATFORM in linux/amd64 linux/arm64; do
            echo "== ${PLATFORM} MP3 =="
            docker run --rm --platform "$PLATFORM" --entrypoint ffmpeg "$IMAGE" \
              -hide_banner -loglevel error \
              -f lavfi -i "sine=frequency=440:sample_rate=44100" \
              -t 1 -c:a libmp3lame /tmp/smoke.mp3
          done
