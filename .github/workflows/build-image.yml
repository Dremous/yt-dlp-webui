name: Build & Push Image

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:              # 支持手动触发
  push:
    branches:
      - main
    tags:
      - "v*"


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # 允许推送 GHCR 包

    # 同一分支/标签串行构建；不取消正在导出的 cache-to，
    # 只让后到的运行排队等待，避免构建结束时缓存写不进去。
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and date
        id: image
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # 缓存按 ref 隔离：main 与 tag 共用 buildcache 会互相覆盖，
          # 导致下一次构建拿到旧缓存。分支名里的 / 替换成 -，保证是合法 tag。
          CACHE_TAG="buildcache-${GITHUB_REF_TYPE}-${GITHUB_REF_NAME//\//-}"
          echo "CACHE_TAG=${CACHE_TAG}" >> "$GITHUB_OUTPUT"
          echo "CACHE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:${CACHE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve cache source
        id: cache
        run: |
          # 首次构建没有 buildcache 时不要传 cache-from，避免把 missing manifest
          # 当成构建错误；有缓存时才启用 registry cache 导入。
          if docker buildx imagetools inspect "${{ steps.image.outputs.CACHE_REF }}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${{ steps.image.outputs.CACHE_REF }}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 将镜像标签版本（DATE-SHORT_SHA）烤入镜像，供「关于」界面显示
          build-args: |
            APP_VERSION=${{ steps.image.outputs.DATE }}-${{ steps.image.outputs.SHORT_SHA }}
          # 缓存放在 GHCR 独立 tag，而不是 GitHub Actions 仓库缓存：
          # 双架构 mode=max 容易触及 GHA 缓存配额，导致旧层被淘汰、命中率下降。
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: type=registry,ref=${{ steps.image.outputs.CACHE_REF }},mode=max,ignore-error=true
          tags: |
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.DATE }}
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.DATE }}-${{ steps.image.outputs.SHORT_SHA }}

      - name: Verify registry cache
        if: success()
        run: |
          # cache-to 的 ignore-error 不让构建失败；这里显式验证缓存确实写入了，
          # 否则缓存导出失败会被静默吞掉。
          docker buildx imagetools inspect "${{ steps.image.outputs.CACHE_REF }}" >/dev/null

      - name: 构建失败通知
        if: failure()
        env:
          # 可选：配置仓库 secret WEBHOOK_URL（飞书/企业微信/钉钉机器人地址）即可推送失败告警
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          echo "::error::yt-dlp-webui 镜像构建失败（run #${{ github.run_number }}）"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -fsS -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"yt-dlp-webui 镜像构建失败 run#${{ github.run_number }}\"}}" || true
          fi
