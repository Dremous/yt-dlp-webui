# ==========================================================================
# 定期拉取新版 yt-dlp 并自动构建 / 推送镜像到 GHCR
#
# 触发方式：
#   1. 定时（schedule） 每周三 02:00 UTC（北京时间每周三 10:00）
#   2. 手动（workflow_dispatch） 在 Actions 页面点 "Run workflow"
#   3. 推送 main 分支 / 打 v* 标签
#
# yt-dlp 在 requirements.txt 中不锁版本，因此每次构建都会拉取最新版，
# 配合定时重建即可实现"自动跟随新版"。
# ==========================================================================
name: Build & Push Image

on:
  schedule:
    - cron: "0 2 * * 3"          # 每周三 02:00 UTC
  workflow_dispatch:              # 支持手动触发
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ github.repository }}   # 即 <owner>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # 允许推送 GHCR 包

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}
