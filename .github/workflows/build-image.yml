name: Build & Push Image

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:              # 支持手动触发
  push:
    branches:
      - main
    tags:
      - "v*"


# 同一分支/标签的整次运行串行；不取消正在导出的 cache-to，
# 只让后到的运行排队等待，避免构建结束时缓存写不进去。
# 同一 run 内的 latest / slim 两个矩阵 job 仍然并行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  build:
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # 允许推送 GHCR 包

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: latest
            target: latest
          - variant: slim
            target: slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and date
        id: image
        run: |
          VARIANT="${{ matrix.variant }}"
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          DATE="$(date -u +%Y%m%d)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "VARIANT=${VARIANT}" >> "$GITHUB_OUTPUT"
          echo "DATE=${DATE}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # 缓存按变体 + ref 隔离：latest 与 slim 的最终层不同，共用同一个
          # cache tag 会互相覆盖；branch/tag 名也可能含 /、中文、空格等
          # OCI tag 不允许的字符，也可能超长。先清洗成合法字符并截断，
          # 再拼 12 位 hash，保证不同 ref 不会因为截断撞到同一个 tag。
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//' | cut -c1-60)
          REF_HASH=$(printf '%s' "${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}" | sha256sum | cut -c1-12)
          CACHE_TAG="buildcache-${VARIANT}-${GITHUB_REF_TYPE}-${SAFE_REF}-${REF_HASH}"
          echo "CACHE_TAG=${CACHE_TAG}" >> "$GITHUB_OUTPUT"
          echo "CACHE_REF=ghcr.io/${IMAGE_NAME}:${CACHE_TAG}" >> "$GITHUB_OUTPUT"

          # 另一变体的缓存只读复用：两个变体共享 runtime / pip / deno 层，
          # 读对方的 registry cache 能提高命中率，但写入仍只写自己的 tag。
          if [ "$VARIANT" = "latest" ]; then
            OTHER_VARIANT=slim
          else
            OTHER_VARIANT=latest
          fi
          OTHER_CACHE_TAG="buildcache-${OTHER_VARIANT}-${GITHUB_REF_TYPE}-${SAFE_REF}-${REF_HASH}"
          echo "OTHER_CACHE_REF=ghcr.io/${IMAGE_NAME}:${OTHER_CACHE_TAG}" >> "$GITHUB_OUTPUT"

          # latest 保持原有三个标签；slim 使用独立标签，避免覆盖 latest。
          if [ "$VARIANT" = "latest" ]; then
            TAGS="$(printf '%s\n' \
              "ghcr.io/${IMAGE_NAME}:latest" \
              "ghcr.io/${IMAGE_NAME}:${DATE}" \
              "ghcr.io/${IMAGE_NAME}:${DATE}-${SHORT_SHA}")"
          else
            TAGS="$(printf '%s\n' \
              "ghcr.io/${IMAGE_NAME}:${VARIANT}" \
              "ghcr.io/${IMAGE_NAME}:${DATE}-${VARIANT}" \
              "ghcr.io/${IMAGE_NAME}:${DATE}-${SHORT_SHA}-${VARIANT}")"
          fi
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve cache source
        id: cache
        run: |
          # 首次构建没有 buildcache 时不要传 cache-from，避免把 missing manifest
          # 当成构建错误；有缓存时才启用 registry cache 导入。
          # 本变体、另一变体依次检查，另一变体只读，不写入。
          : > /tmp/cache-from
          for ref in "${{ steps.image.outputs.CACHE_REF }}" "${{ steps.image.outputs.OTHER_CACHE_REF }}"; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "type=registry,ref=${ref}" >> /tmp/cache-from
            fi
          done
          {
            echo "from<<EOF"
            cat /tmp/cache-from
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable BtbN FFmpeg GPL build
        id: ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FALLBACK="9.0"
          API="https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          if ! JSON=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API"); then
            echo "GitHub API 不可用，回退到 BtbN n${FALLBACK} GPL 构建" >&2
            VERSION="$FALLBACK"
          else
            VERSION=$(printf '%s' "$JSON" \
              | jq -r '.assets[].name' \
              | sed -nE 's/^ffmpeg-n([0-9]+\.[0-9]+)-latest-linux64-gpl-\1\.tar\.xz$/\1/p' \
              | sort -V \
              | tail -n1 || true)
            if [ -z "${VERSION:-}" ]; then
              echo "BtbN latest release 中没有稳定 GPL 资产，回退到 n${FALLBACK}" >&2
              VERSION="$FALLBACK"
            else
              for ARCH in linux64 linuxarm64; do
                ASSET="ffmpeg-n${VERSION}-latest-${ARCH}-gpl-${VERSION}.tar.xz"
                if ! printf '%s' "$JSON" \
                  | jq -e --arg name "$ASSET" '.assets[]? | select(.name == $name)' >/dev/null; then
                  echo "BtbN 缺少资产 ${ASSET}，回退到 n${FALLBACK}" >&2
                  VERSION="$FALLBACK"
                  break
                fi
              done
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved BtbN FFmpeg GPL stable branch: n${VERSION}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: ${{ matrix.target }}
          # 将镜像标签版本（DATE-SHORT_SHA）烤入镜像，供「关于」界面显示
          # FFMPEG_BUILDS_REFRESH 按 run 变化，强制 slim 每次重新下载 BtbN 资产。
          build-args: |
            APP_VERSION=${{ steps.image.outputs.DATE }}-${{ steps.image.outputs.SHORT_SHA }}
            FFMPEG_BUILDS_VERSION=${{ steps.ffmpeg.outputs.version }}
            FFMPEG_BUILDS_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # 缓存放在 GHCR 独立 tag，而不是 GitHub Actions 仓库缓存：
          # 双架构 mode=max 容易触及 GHA 缓存配额，导致旧层被淘汰、命中率下降。
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: type=registry,ref=${{ steps.image.outputs.CACHE_REF }},mode=max,ignore-error=true
          tags: ${{ steps.image.outputs.TAGS }}

      - name: Verify registry cache
        if: success()
        run: |
          # cache-to 的 ignore-error 不让构建失败；这里显式验证缓存确实写入了，
          # 否则缓存导出失败会被静默吞掉。
          docker buildx imagetools inspect "${{ steps.image.outputs.CACHE_REF }}" >/dev/null

      - name: 构建失败通知
        if: failure()
        env:
          # 可选：配置仓库 secret WEBHOOK_URL（飞书/企业微信/钉钉机器人地址）即可推送失败告警
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          echo "::error::yt-dlp-webui ${{ matrix.variant }} 镜像构建失败（run #${{ github.run_number }}）"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -fsS -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"yt-dlp-webui ${{ matrix.variant }} 镜像构建失败 run#${{ github.run_number }}\"}}" || true
          fi

  smoke:
    name: Smoke test ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [latest, slim]

    steps:
      - name: Compute image name
        id: image
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: |
          docker pull "ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ matrix.variant }}"

      - name: Verify ffmpeg and ffprobe
        run: |
          IMAGE="ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ matrix.variant }}"
          docker run --rm --entrypoint ffmpeg "$IMAGE" -version
          docker run --rm --entrypoint ffprobe "$IMAGE" -version

      - name: Verify slim MP3 encoder
        if: matrix.variant == 'slim'
        run: |
          IMAGE="ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ matrix.variant }}"
          docker run --rm --entrypoint ffmpeg "$IMAGE" \
            -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -t 1 -c:a libmp3lame /tmp/smoke.mp3
