<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="heroTitle heroDesc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="heroTitle">yt-dlp WebUI</title>
  <desc id="heroDesc">深色标题板。左侧是项目名、一句话说明与 docker compose up -d 启动命令；右侧是界面示意，展示已完成、下载中、失败三种任务状态。</desc>

  <defs>
    <!-- 与 WebUI 页面一致的左上角绿色氛围光 -->
    <radialGradient id="heroGlow" cx="16%" cy="-8%" r="78%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0a0f1c"/>
  <rect width="1200" height="400" rx="24" fill="url(#heroGlow)"/>

  <!-- 标题区 -->
  <text x="64" y="92" font-size="18" letter-spacing="2.6" fill="#64748b"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DOCKER · FASTAPI · YT-DLP</text>

  <text x="62" y="170" font-size="64" font-weight="700" letter-spacing="-1.4" fill="#f8fafc">yt-dlp WebUI</text>

  <text x="64" y="214" font-size="24" fill="#cbd5e1">粘贴链接，下载视频与音频。</text>
  <text x="64" y="248" font-size="24" fill="#cbd5e1">内置代理、Cookie 与失败诊断。</text>

  <!-- 启动命令 -->
  <g transform="translate(64 286)">
    <rect width="352" height="54" rx="12" fill="#131c2e" stroke="#2a3450"/>
    <text x="22" y="34" font-size="19" fill="#22c55e"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$</text>
    <text x="46" y="34" font-size="19" fill="#e2e8f0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docker compose up -d</text>
  </g>

  <!-- 界面示意：任务列表（三种状态同时出现） -->
  <rect x="660" y="42" width="474" height="302" rx="18" fill="#131c2e" stroke="#2a3450"/>

  <text x="684" y="82" font-size="21" font-weight="600" fill="#f8fafc">下载任务</text>
  <rect x="1052" y="60" width="58" height="28" rx="14" fill="#22c55e" fill-opacity="0.14"/>
  <text x="1081" y="79.5" font-size="16" font-weight="600" fill="#4ade80" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text>

  <line x1="660" y1="100" x2="1134" y2="100" stroke="#2a3450"/>

  <!-- 已完成 -->
  <circle cx="690" cy="126" r="5" fill="#10b981"/>
  <text x="706" y="132" font-size="19" fill="#e2e8f0">示例视频 1080p.mp4</text>
  <text x="1110" y="132" font-size="17" fill="#10b981" text-anchor="end">已完成</text>
  <text x="706" y="160" font-size="16" fill="#64748b"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">128.4 MB · 用时 42 秒</text>

  <!-- 下载中 -->
  <circle cx="690" cy="202" r="5" fill="#22c55e"/>
  <text x="706" y="208" font-size="19" fill="#e2e8f0">示例音频 MP3 192kbps</text>
  <text x="1110" y="208" font-size="17" fill="#22c55e" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">68%</text>
  <rect x="684" y="222" width="426" height="6" rx="3" fill="#2a3450"/>
  <rect x="684" y="222" width="290" height="6" rx="3" fill="#22c55e"/>
  <text x="706" y="248" font-size="15" fill="#64748b"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.2 MB/s · 剩余 00:12</text>

  <!-- 失败 -->
  <circle cx="690" cy="278" r="5" fill="#ef4444"/>
  <text x="706" y="284" font-size="19" fill="#e2e8f0">示例视频 · 私享内容</text>
  <text x="1110" y="284" font-size="17" fill="#ef4444" text-anchor="end">失败</text>
  <text x="706" y="312" font-size="15" fill="#f87171"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ERROR: This video is unavailable</text>
</svg>
