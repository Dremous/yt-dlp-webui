services:
  yt-dlp-webui:
    container_name: yt-dlp-webui
    image: ghcr.io/dremous/yt-dlp-webui:latest
    ports:
      - "8080:8080"
    volumes:
      # 下载文件持久化
      - ./downloads:/downloads
      # Cookie 持久化
      - ./config:/config
    environment:
      - DOWNLOAD_DIR=/downloads
      - COOKIE_FILE=/config/cookies.txt
    restart: unless-stopped
