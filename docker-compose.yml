services:
  yt-dlp-webui:
    container_name: yt-dlp-webui
    image: ghcr.io/dremous/yt-dlp-webui:latest
    ports:
      # BIND_ADDR 控制系统对外绑定的网卡：默认 0.0.0.0 保持现有局域网访问；
      # 建议在只信任 LAN 的机器上设为具体 LAN IP（如 192.168.1.10），
      # 避免同时暴露到 VPN/公网网卡。设为 127.0.0.1 则只允许本机访问。
      # PORT 默认 8080；在宿主机设置 PORT=9000 时映射与容器监听一起跟随。
      # PORT 必须是 1-65535 的整数：Compose 在启动前做变量替换，非法值会
      # 直接报错（fail-fast），不会出现应用回退 8080、映射却仍是 abc:abc 的状态。
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      # 下载文件持久化
      - ./downloads:/downloads
      # Cookie 与代理配置持久化
      - ./config:/config
    environment:
      - DOWNLOAD_DIR=/downloads
      - COOKIE_FILE=/config/cookies.txt
      - PROXY_FILE=/config/proxy.txt
      # 运行日志落盘（轮转与级别可用 LOG_MAX_MB / LOG_BACKUPS / LOG_LEVEL 调整）
      - LOG_FILE=/config/webui.log
      # 容器内监听端口；与上面的 ports 映射使用同一个变量
      - PORT=${PORT:-8080}
      # 运行用户/组的 UID/GID，默认 10001；设为宿主机用户（如 1000）可让
      # ./downloads、./config 直接归你所有，避免宿主机改不动下载文件。
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      # 容器内时区，默认 Asia/Shanghai；改成 UTC、Asia/Tokyo 等 IANA 时区即可。
      - TZ=${TZ:-Asia/Shanghai}
      # 自定义域名访问时添加，逗号分隔；私网 IP 和 localhost 已默认放行。
      - WEBUI_ALLOWED_HOSTS=${WEBUI_ALLOWED_HOSTS:-}
    # 让容器内可以用 host.docker.internal 指向宿主机（Linux 原生 Docker 必需，
    # Docker Desktop 自带；国内代理装在宿主机时靠它访问）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
